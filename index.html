<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mirage (Taylor's Version) — Path of Exile Private League</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Open+Sans:wght@300;400;600&display=swap');

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --gold: #c8a45a;
      --gold-light: #f0d080;
      --gold-dark: #8a6a2a;
      --bg-dark: #0a0a0e;
      --bg-mid: #12121a;
      --text-light: #e8dcc8;
      --text-muted: #8a7a60;
      --glow: rgba(200, 164, 90, 0.4);
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Open Sans', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    /* ── Hero ── */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1rem;
      overflow: hidden;
    }

    /* layered background: base colour + radial gradient haze */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(30, 20, 5, 0.7) 0%, transparent 70%),
        url('https://web.poecdn.com/protected/image/layout/mirage/background.jpg?v=1&key=QcCXRHaqwfFQHHYOJF6oIA')
          center / cover no-repeat;
      z-index: 0;
    }

    /* dark vignette on top of image */
    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 100% 100% at 50% 0%, transparent 40%, var(--bg-dark) 100%);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 860px;
      width: 100%;
    }

    /* ── League badge ── */
    .badge {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold-dark);
      padding: 0.35em 1.2em;
      border-radius: 2px;
      margin-bottom: 1.6rem;
      background: rgba(10, 8, 0, 0.55);
    }

    /* ── Title ── */
    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 900;
      font-size: clamp(2rem, 8vw, 4.5rem);
      line-height: 1.1;
      color: var(--gold-light);
      text-shadow:
        0 0 40px var(--glow),
        0 0 80px rgba(200, 164, 90, 0.2);
      margin-bottom: 0.3em;
      letter-spacing: 0.03em;
    }

    h1 .taylors {
      display: block;
      font-size: 0.55em;
      color: var(--gold);
      letter-spacing: 0.12em;
      font-weight: 700;
      margin-top: 0.15em;
    }

    /* ── Subtitle ── */
    .subtitle {
      font-size: clamp(0.85rem, 2vw, 1.05rem);
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-bottom: 2.8rem;
    }

    /* ── Divider ── */
    .divider {
      width: 120px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 0 auto 2.8rem;
    }

    /* ── Countdown ── */
    .countdown-wrapper {
      margin-bottom: 3rem;
    }

    .countdown-label {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
    }

    .countdown {
      display: flex;
      gap: clamp(0.8rem, 3vw, 2rem);
      justify-content: center;
      flex-wrap: wrap;
    }

    .countdown-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 70px;
    }

    .countdown-number {
      font-family: 'Cinzel', serif;
      font-size: clamp(2rem, 7vw, 3.8rem);
      font-weight: 700;
      color: var(--gold-light);
      line-height: 1;
      text-shadow: 0 0 20px var(--glow);
      background: rgba(10, 8, 0, 0.55);
      border: 1px solid var(--gold-dark);
      border-radius: 4px;
      padding: 0.25em 0.5em;
      min-width: 2ch;
      text-align: center;
    }

    .countdown-unit-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 0.6rem;
    }

    /* when league is live */
    .league-live {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.2rem, 4vw, 2rem);
      color: var(--gold-light);
      text-shadow: 0 0 30px var(--glow);
      letter-spacing: 0.08em;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    /* ── CTA Button ── */
    .cta {
      display: inline-block;
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--bg-dark);
      background: linear-gradient(135deg, var(--gold), var(--gold-light) 50%, var(--gold));
      background-size: 200% 100%;
      text-decoration: none;
      padding: 0.85em 2.4em;
      border-radius: 3px;
      transition: background-position 0.4s ease, box-shadow 0.3s ease, transform 0.15s ease;
      box-shadow: 0 0 20px rgba(200, 164, 90, 0.35);
    }

    .cta:hover {
      background-position: 100% 0;
      box-shadow: 0 0 40px rgba(200, 164, 90, 0.6);
      transform: translateY(-2px);
    }

    .cta:active {
      transform: translateY(0);
    }

    /* ── League start info ── */
    .start-info {
      margin-top: 1.8rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }

    /* ── Footer ── */
    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 1.6rem 1rem;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }

    footer a {
      color: var(--gold-dark);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--gold);
    }

    /* ── Particle sparkles (CSS only) ── */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: var(--gold);
      opacity: 0;
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.3; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- floating gold dust -->
  <div class="particles" aria-hidden="true" id="particles"></div>

  <main class="hero">
    <div class="hero-content">
      <div class="badge">Path of Exile · Private League</div>

      <h1>
        Mirage
        <span class="taylors">(Taylor's Version)</span>
      </h1>

      <p class="subtitle">A private league for the brave (and probably cursed)</p>

      <div class="divider"></div>

      <!-- Countdown -->
      <div class="countdown-wrapper">
        <p class="countdown-label" id="countdown-label">League starts in</p>
        <div class="countdown" id="countdown" aria-live="polite">
          <div class="countdown-unit">
            <span class="countdown-number" id="cd-days">--</span>
            <span class="countdown-unit-label">Days</span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-number" id="cd-hours">--</span>
            <span class="countdown-unit-label">Hours</span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-number" id="cd-minutes">--</span>
            <span class="countdown-unit-label">Minutes</span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-number" id="cd-seconds">--</span>
            <span class="countdown-unit-label">Seconds</span>
          </div>
        </div>
      </div>

      <a
        class="cta"
        href="https://www.pathofexile.com/private-leagues/league/Mirage+Taylors+Version"
        target="_blank"
        rel="noopener noreferrer"
      >
        Join the League
      </a>

      <p class="start-info">League started · 23 March 2026 · 20:00 CET</p>
    </div>
  </main>

  <footer>
    <p>Not affiliated with Grinding Gear Games &nbsp;·&nbsp; <a href="https://www.pathofexile.com" target="_blank" rel="noopener noreferrer">pathofexile.com</a></p>
  </footer>

  <script>
    // ── Countdown ──────────────────────────────────────────────────
    // League start: 23 March 2026 20:00 CET (UTC+1)
    const LEAGUE_START = new Date('2026-03-23T19:00:00Z'); // 20:00 CET = 19:00 UTC

    function pad(n) {
      return String(Math.max(0, n)).padStart(2, '0');
    }

    function tick() {
      const now = Date.now();
      const diff = LEAGUE_START.getTime() - now;

      if (diff <= 0) {
        // League has started
        document.getElementById('countdown-label').textContent = '';
        document.getElementById('countdown').innerHTML =
          '<span class="league-live">⚡ League is Live! ⚡</span>';
        return; // stop ticking
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days    = Math.floor(totalSeconds / 86400);
      const hours   = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      document.getElementById('cd-days').textContent    = pad(days);
      document.getElementById('cd-hours').textContent   = pad(hours);
      document.getElementById('cd-minutes').textContent = pad(minutes);
      document.getElementById('cd-seconds').textContent = pad(seconds);

      setTimeout(tick, 1000);
    }

    tick();

    // ── Particles ─────────────────────────────────────────────────
    (function spawnParticles() {
      const container = document.getElementById('particles');
      const COUNT = 40;

      for (let i = 0; i < COUNT; i++) {
        const el = document.createElement('div');
        el.className = 'particle';

        const size = Math.random() * 2 + 1;
        el.style.cssText = [
          `width:${size}px`,
          `height:${size}px`,
          `left:${Math.random() * 100}%`,
          `animation-duration:${6 + Math.random() * 12}s`,
          `animation-delay:${Math.random() * 14}s`,
          `opacity:0`,
        ].join(';');

        container.appendChild(el);
      }
    })();
  </script>
</body>
</html>
